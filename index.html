<style>
:root{
  --bg:#F4F2ED; --paper:#FFFFFF; --ink:#1A1D21; --sub:#6E7680; --faint:#9AA2AA;
  --line:#E2DFD7; --hair:#EDEAE3; --accent:#B0432C; --ok:#2F6D8C;
  --lift:0 1px 1px rgba(26,29,33,.04), 0 10px 30px -12px rgba(26,29,33,.18);
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px;
}
html[data-theme="dark"]{
  --bg:#101315; --paper:#191D21; --ink:#E8E6E1; --sub:#8E979F; --faint:#6B747C;
  --line:#2A3036; --hair:#22282D; --accent:#CE6D53; --ok:#79ADC9;
  --lift:0 1px 1px rgba(0,0,0,.5), 0 12px 34px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:1.5px solid var(--ok);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}

.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);
  background:linear-gradient(var(--bg) 72%,transparent)}
.top-in{max-width:760px;margin:0 auto;padding:16px 20px 10px;display:flex;align-items:center;gap:11px}
.mark{width:25px;height:25px;flex:none;border-radius:6.5px;box-shadow:0 1px 4px rgba(26,29,33,.16)}
.brand{font-family:var(--mincho);font-size:17px;font-weight:600;letter-spacing:.16em;margin:0}
.ver{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em;
  border:1px solid var(--line);border-radius:99px;padding:1px 7px;line-height:1.6;align-self:center}
.grow{flex:1}
.ico{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--sub);
  transition:background .15s,color .15s}
.ico:hover{background:var(--hair);color:var(--ink)}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.segwrap{max-width:760px;margin:0 auto;padding:0 20px 14px;display:flex;align-items:center;gap:12px}
.segwrap{overflow-x:auto;scrollbar-width:none}
.segwrap::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--hair);border-radius:11px;padding:3px;flex:none}
.seg button{padding:5px 15px;border-radius:8px;font-size:12.5px;letter-spacing:.08em;color:var(--sub);
  transition:.18s}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);
  box-shadow:0 1px 2px rgba(26,29,33,.07)}
.count{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}

.wrap{max-width:760px;margin:0 auto;padding:4px 20px 140px}

.searchbar{position:relative;margin-bottom:26px}
.searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  fill:none;stroke:var(--faint);stroke-width:1.7}
.search{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:7px 4px 7px 34px;font-size:14px;transition:border-color .2s}
.search:focus{outline:none;border-bottom-color:var(--ink)}
.search::placeholder{color:var(--faint)}

.month{position:sticky;top:var(--hdrh,104px);z-index:20;margin:30px -20px 16px;padding:9px 20px;
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.month:first-child{margin-top:0}
.month b{font-family:var(--mincho);font-size:15.5px;font-weight:600;letter-spacing:.06em}
.month i{flex:1;height:1px;background:var(--line);font-style:normal}
.month u{text-decoration:none;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.1em}

.entry{margin-bottom:34px}
.dateline{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.dd{font-family:var(--mincho);font-size:27px;line-height:1;font-weight:600}
.mm{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.14em}
.chip{font-size:10.5px;letter-spacing:.1em;color:var(--accent);border:1px solid currentColor;
  border-radius:99px;padding:1px 9px;line-height:1.7}
.chip.ai{color:var(--ok)}
.pane{background:var(--paper);border-radius:var(--r);box-shadow:var(--lift);overflow:hidden}
.pane .txt{padding:17px 19px 16px}
.pane h3{font-family:var(--mincho);font-size:19px;font-weight:600;margin:0;line-height:1.6;letter-spacing:.02em}
.pane p{white-space:pre-wrap;margin:7px 0 0;color:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.tools{display:flex;gap:16px;align-items:center;padding:11px 19px;border-top:1px solid var(--hair);
  font-size:12px;color:var(--faint)}
.tools button{transition:color .15s}
.tools button:hover{color:var(--ink)}
.tools .want{color:var(--accent)}

.shots{display:grid;gap:2px}
.shots.n1{grid-template-columns:1fr}
.shots.n2{grid-template-columns:1fr 1fr}
.shots.n3{grid-template-columns:2fr 1fr}
.shots.n3 .s0{grid-row:span 2}
.shots.n4{grid-template-columns:repeat(2,1fr)}
.shots.n5,.shots.n6{grid-template-columns:repeat(3,1fr)}
.shot{position:relative;aspect-ratio:1/1;background:var(--hair);overflow:hidden}
.shots.n1 .shot{aspect-ratio:3/2}
.shots.n3 .s0{aspect-ratio:auto}
.shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transform:scale(1.02);transition:opacity .5s ease,transform .5s ease}
.shot img.on{opacity:1;transform:scale(1)}
.shot .plus{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,19,21,.46);
  color:#fff;font-family:var(--mono);font-size:15px}

.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:20px 16px}
.alb{text-align:left}
.alb .cv{aspect-ratio:3/4;border-radius:13px;overflow:hidden;background:var(--hair);
  box-shadow:var(--lift);position:relative}
.alb .cv img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.alb .cv img.on{opacity:1}
.alb .cv em{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font-style:normal;
  font-family:var(--mono);font-size:10.5px;color:#fff;letter-spacing:.1em;
  background:linear-gradient(transparent,rgba(16,19,21,.62))}
.alb h4{font-family:var(--mincho);font-size:15px;margin:10px 0 1px;font-weight:600}
.alb p{margin:0;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}

.tblwrap{background:var(--paper);border-radius:var(--r);box-shadow:var(--lift);overflow-x:auto}
table.rec{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.rec th.cst,table.rec td.cst{width:34px;padding-left:12px;padding-right:0;text-align:center}
table.rec th{position:sticky;top:0;background:var(--paper);text-align:left;font-weight:500;
  font-size:11px;letter-spacing:.12em;color:var(--faint);padding:13px 14px;white-space:nowrap;
  border-bottom:1px solid var(--line);cursor:pointer;transition:color .15s;z-index:1}
table.rec th:hover{color:var(--ink)}
table.rec th .ar{opacity:0;margin-left:5px;font-size:9px}
table.rec th.on{color:var(--ink)}
table.rec th.on .ar{opacity:1}
table.rec td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:top}
table.rec tr:last-child td{border-bottom:none}
table.rec tbody tr{cursor:pointer;transition:background .13s}
table.rec tbody tr:hover{background:var(--hair)}
table.rec .cD{font-family:var(--mono);font-size:11.5px;color:var(--sub);white-space:nowrap;letter-spacing:.04em}
table.rec .cT{font-family:var(--mincho);font-size:15px;font-weight:600;line-height:1.5}
table.rec .cT small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;
  color:var(--faint);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical}
table.rec .cA{color:var(--accent);font-size:12px}
table.rec .cN{font-family:var(--mono);font-size:11.5px;color:var(--sub);text-align:right;white-space:nowrap}
table.rec .cS{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
table.rec .cS.ai{color:var(--ok)}
.tblfoot{display:flex;gap:14px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--faint);
  font-family:var(--mono);letter-spacing:.06em}
.tblfoot button{color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.tblfoot button:hover{color:var(--ink)}
/* ══ カレンダー ══ */
.calbar{display:flex;align-items:center;gap:14px;margin:2px 0 20px}
.calbar h2{font-family:var(--mincho);font-size:21px;font-weight:600;margin:0;letter-spacing:.06em;
  min-width:150px}
.calbar button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--sub);
  border:1px solid var(--line);transition:.15s}
.calbar button:hover{border-color:var(--ink);color:var(--ink)}
.calbar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.calbar .today{width:auto;padding:0 13px;font-size:12px;letter-spacing:.08em}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:7px}
.wk span{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
.wk span.s6{color:var(--ok)}
.wk span.s0{color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1/1;border-radius:11px;background:var(--paper);overflow:hidden;
  box-shadow:0 1px 1px rgba(26,29,33,.04);transition:transform .13s}
.cell.void{background:transparent;box-shadow:none}
.cell.has{cursor:pointer}
.cell.has:hover{transform:scale(1.04)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.cell img.on{opacity:1}
.cell b{position:absolute;top:5px;left:7px;z-index:2;font-family:var(--mono);font-size:11px;
  font-weight:500;color:var(--sub);letter-spacing:.03em}
.cell.shot b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cell.now{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cell.now b{color:var(--accent)}
.cell.shot.now b{color:#fff}
.cell .dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;
  border-radius:50%;background:var(--accent);z-index:2}
.cell .ttl{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;z-index:2;
  font-size:9.5px;line-height:1.3;color:var(--sub);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell.shot .ttl{color:#fff;background:linear-gradient(transparent,rgba(16,19,21,.7))}
.calsum{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}

/* ══ ノート（めくり） ══ */
.bookstage{perspective:2200px;margin:2px 0 18px}
.leaf{position:relative;background:var(--paper);border-radius:6px 16px 16px 6px;
  box-shadow:var(--lift),inset 7px 0 14px -12px rgba(26,29,33,.5);
  min-height:62vh;padding:26px 26px 54px 30px;overflow:hidden;
  transform-origin:left center;backface-visibility:hidden}
.leaf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(var(--line),color-mix(in srgb,var(--line) 40%,transparent))}
.leaf.turn-f{animation:tf .42s cubic-bezier(.4,.05,.35,1)}
.leaf.turn-b{animation:tb .42s cubic-bezier(.4,.05,.35,1)}
@keyframes tf{from{transform:rotateY(0);opacity:1}60%{opacity:.5}to{transform:rotateY(-32deg);opacity:0}}
@keyframes tb{from{transform:rotateY(28deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.leaf .lmon{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--faint);
  margin-bottom:14px}
.leaf .lday{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.leaf .lday b{font-family:var(--mincho);font-size:38px;line-height:1;font-weight:600}
.leaf .lday span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em}
.leaf h3{font-family:var(--mincho);font-size:22px;font-weight:600;margin:0 0 10px;line-height:1.55}
.leaf p{white-space:pre-wrap;margin:0;font-size:14.5px;line-height:2}
.leaf .lpic{display:grid;gap:4px;margin-top:16px}
.leaf .lpic.q1{grid-template-columns:1fr}
.leaf .lpic.q2,.leaf .lpic.q4{grid-template-columns:1fr 1fr}
.leaf .lpic.q3,.leaf .lpic.q5,.leaf .lpic.q6{grid-template-columns:repeat(3,1fr)}
.leaf .lpic div{position:relative;aspect-ratio:1/1;border-radius:7px;overflow:hidden;background:var(--hair);
  cursor:pointer}
.leaf .lpic.q1 div{aspect-ratio:3/2}
.leaf .lpic img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.leaf .lpic img.on{opacity:1}
.leaf .lfoot{position:absolute;left:30px;right:26px;bottom:18px;display:flex;align-items:center;gap:14px;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.1em;
  border-top:1px solid var(--hair);padding-top:11px}
.leaf .lfoot button{color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.leaf .lfoot button:hover{color:var(--ink)}
.pager{display:flex;align-items:center;justify-content:center;gap:16px}
.pager button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;
  place-items:center;color:var(--sub);transition:.15s}
.pager button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.pager button:disabled{opacity:.3;cursor:default}
.pager svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.pager .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.14em;min-width:76px;
  text-align:center}
/* ══ Treasure ══ */
.star{display:inline-flex;align-items:center;gap:5px;color:var(--faint);transition:color .15s}
.star svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linejoin:round}
.star:hover{color:var(--accent)}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.bookbar{display:flex;align-items:center;gap:12px;margin:2px 0 16px;flex-wrap:wrap}
.bookbar .seg button{font-size:12px;padding:5px 13px}
.bookbar .hint{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.leaf .lmark{position:absolute;top:24px;right:24px;color:var(--accent)}
.leaf .lmark svg{width:17px;height:17px;fill:currentColor;stroke:none}
.blank{text-align:center;padding:70px 24px;color:var(--sub)}
.blank b{display:block;font-family:var(--mincho);font-size:20px;color:var(--ink);margin-bottom:10px;font-weight:600}
.blank span{font-size:13.5px}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:40;display:flex;align-items:center;gap:2px;padding:5px;border-radius:16px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  box-shadow:0 2px 6px rgba(26,29,33,.06),0 16px 40px -14px rgba(26,29,33,.3)}
.dock button{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:12px;
  font-size:13px;letter-spacing:.05em;color:var(--ink);transition:background .16s;white-space:nowrap}
.dock button:hover{background:var(--hair)}
.dock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.dock .go{color:var(--accent)}

.veil{position:fixed;inset:0;background:rgba(12,14,16,.4);backdrop-filter:blur(3px);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .26s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;overflow:auto;background:var(--bg);
  max-height:min(93vh, calc(100dvh - env(safe-area-inset-top) - 14px));
  border-radius:22px 22px 0 0;z-index:60;padding:0 20px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .32s cubic-bezier(.22,.9,.24,1);
  box-shadow:0 -12px 50px -18px rgba(0,0,0,.4);overscroll-behavior:contain}
.sheet.dragging{transition:none}
.sheet.on{transform:translateY(0)}
@media(min-width:700px){.sheet{max-width:620px;margin:0 auto;border-radius:20px;bottom:26px;left:20px;right:20px}}
.grab{display:block;width:100%;padding:11px 0 9px;background:none;border:none;cursor:grab;
  touch-action:none}
.grab::before{content:"";display:block;width:44px;height:5px;border-radius:99px;background:var(--line);
  margin:0 auto;transition:background .15s,width .15s}
.grab:hover::before{background:var(--sub);width:56px}
.sheethead{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -20px;padding:0 20px;
  padding-top:env(safe-area-inset-top)}
.shead{display:flex;align-items:center;gap:10px;padding-bottom:16px}
.shead .ico{width:44px;height:44px;border-radius:14px;background:var(--hair);color:var(--ink)}
.shead .ico svg{width:19px;height:19px}
.shead .ico:hover{background:var(--line)}
.shead h2{font-family:var(--mincho);font-size:18px;margin:0;font-weight:600;letter-spacing:.06em}
.note{color:var(--sub);font-size:13px;line-height:1.85;margin:0 0 18px}

.f{display:block;margin-bottom:16px}
.f span{display:block;font-size:11px;letter-spacing:.14em;color:var(--faint);margin-bottom:6px}
.f input,.f textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:15px;font-family:inherit;transition:border-color .18s}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--ok)}
.f textarea{min-height:132px;resize:vertical;line-height:1.85}
.f textarea.mono{font-family:var(--mono);font-size:12.5px;line-height:1.7}
.two{display:flex;gap:12px}
.two .f{flex:1;min-width:0}

.b{border-radius:12px;padding:11px 20px;font-size:13.5px;letter-spacing:.07em;transition:.16s}
.b.solid{background:var(--ink);color:var(--bg)}
.b.solid:hover{opacity:.86}
.b.line{border:1px solid var(--line);color:var(--sub)}
.b.line:hover{border-color:var(--ink);color:var(--ink)}
.b.danger{color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.b:disabled{opacity:.45;cursor:default}
.act{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;margin-top:7px}
.tile{position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:var(--hair)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile button{position:absolute;top:4px;right:4px;width:21px;height:21px;border-radius:50%;
  background:rgba(12,14,16,.62);color:#fff;font-size:11px;display:grid;place-items:center}
.tileadd{aspect-ratio:1/1;border:1px dashed var(--line);border-radius:11px;display:grid;place-items:center;
  color:var(--faint);transition:.16s}
.tileadd:hover{border-color:var(--ok);color:var(--ok)}
.tileadd svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}

.pv{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.pv:last-of-type{border-bottom:none}
.pv input{margin-top:6px;accent-color:var(--ok);width:17px;height:17px;flex:none}
.pv h4{font-family:var(--mincho);font-size:15.5px;margin:0 0 3px;font-weight:600}
.pv .m{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.pv .t{font-size:13px;color:var(--sub);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.pv.dupe{opacity:.5}

.lb{position:fixed;inset:0;background:#0A0C0D;z-index:80;display:none;place-items:center}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:86vh;object-fit:contain}
.lb .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;color:#fff;opacity:.8}
.lb .arw{position:absolute;top:50%;transform:translateY(-50%);color:#fff;padding:16px;opacity:.7}
.lb .arw.l{left:2px}.lb .arw.r{right:2px}
.lb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.lb .idx{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.16em;opacity:.65}

/* ══ 冊子 ══ */
#book{display:none}
@media print{
  @page{margin:16mm 14mm}
  html,body{background:#fff!important;color:#000!important}
  .top,.dock,.veil,.sheet,.lb,.toast,main.wrap{display:none!important}
  #book{display:block!important}
  #book *{color:#000!important}
  .bk-cover{text-align:center;padding:64mm 0 0;page-break-after:always}
  .bk-cover h1{font-family:var(--mincho);font-size:30pt;font-weight:600;letter-spacing:.14em;margin:0 0 10mm}
  .bk-cover p{font-family:var(--mono);font-size:10pt;letter-spacing:.2em;margin:0 0 3mm}
  .bk-mon{font-family:var(--mincho);font-size:13pt;font-weight:600;letter-spacing:.1em;
    border-bottom:.4pt solid #000;padding-bottom:2mm;margin:10mm 0 6mm}
  .bk-e{page-break-inside:avoid;margin:0 0 9mm}
  .bk-h{display:flex;align-items:baseline;gap:4mm;margin-bottom:2.5mm}
  .bk-h b{font-family:var(--mincho);font-size:14pt;font-weight:600}
  .bk-h span{font-family:var(--mono);font-size:8pt;letter-spacing:.14em}
  .bk-t{font-family:var(--mincho);font-size:12.5pt;font-weight:600;margin:0 0 1.5mm;line-height:1.5}
  .bk-b{font-size:9.5pt;line-height:1.85;white-space:pre-wrap;margin:0}
  .bk-p{display:grid;gap:1.5mm;margin-top:3mm}
  .bk-p.p1{grid-template-columns:1fr}
  .bk-p.p2,.bk-p.p4{grid-template-columns:1fr 1fr}
  .bk-p.p3,.bk-p.p5,.bk-p.p6{grid-template-columns:repeat(3,1fr)}
  .bk-p img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;display:block}
  .bk-p.p1 img{aspect-ratio:3/2}
}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);background:var(--ink);
  color:var(--bg);font-size:12.5px;padding:10px 18px;border-radius:13px;z-index:90;opacity:0;
  pointer-events:none;transition:.24s;max-width:86vw;text-align:center;box-shadow:var(--lift)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
'use strict';
const LS={url:'mos.url',entries:'mos.entries',theme:'mos.theme'};
const S={url:localStorage.getItem(LS.url)||'',
  entries:JSON.parse(localStorage.getItem(LS.entries)||'[]'),
  view:'table',query:'',album:null,editing:null,draft:[],staged:[],
  sort:{k:'date',d:-1},cal:null,page:0,onlyStar:true};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const store=()=>localStorage.setItem(LS.entries,JSON.stringify(S.entries));

function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(LS.theme,t);
  $('meta[name=theme-color]').content=t==='dark'?'#101315':'#F4F2ED';}
setTheme(localStorage.getItem(LS.theme)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800);}

let dbP;
const db=()=>dbP||=new Promise((res,rej)=>{const r=indexedDB.open('memoryos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos');
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function cGet(id){const d=await db();return new Promise(r=>{
  const q=d.transaction('photos').objectStore('photos').get(id);
  q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);});}
async function cPut(id,u){const d=await db();return new Promise(r=>{
  const tx=d.transaction('photos','readwrite');tx.objectStore('photos').put(u,id);
  tx.oncomplete=()=>r();tx.onerror=()=>r();});}

async function api(action,p={}){
  if(!S.url) throw new Error('GAS の URL が未設定です');
  const r=await fetch(S.url,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...p})});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'通信に失敗しました');
  return j;
}

function shrink(file,max=1600,q=.82){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>rej(new Error('画像を読み込めませんでした'));img.src=fr.result;};
  fr.onerror=()=>rej(new Error('画像を読み込めませんでした'));fr.readAsDataURL(file);});}

const inflight=new Map();
async function photoUrl(id){
  const hit=await cGet(id); if(hit) return hit;
  if(inflight.has(id)) return inflight.get(id);
  const p=api('photo',{id}).then(async j=>{
    const u='data:'+j.mimeType+';base64,'+j.data; await cPut(id,u); inflight.delete(id); return u;
  }).catch(e=>{inflight.delete(id);throw e;});
  inflight.set(id,p); return p;
}
function hydrate(scope=document){
  scope.querySelectorAll('img[data-pid]:not([data-done])').forEach(async img=>{
    img.dataset.done='1';
    try{img.src=await photoUrl(img.dataset.pid);img.classList.add('on');}
    catch{img.closest('.shot,.cv')?.setAttribute('title','写真を読み込めませんでした');}
  });
}

const D=d=>new Date(d+'T00:00');
const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.7 6.2.7-4.6 4.2 1.3 6.1L12 16.8 6.5 19.9l1.3-6.1L3.2 9.6l6.2-.7z"/></svg>';
function starBtn(e){
  return `<button class="star ${e.star?'on':''}" data-star="${e.id}"
    aria-label="${e.star?'Treasure を外す':'Treasure にする'}">${STAR_SVG}</button>`;
}
async function toggleStar(id){
  const e=S.entries.find(x=>x.id===id); if(!e) return;
  const next={...e,star:!e.star,updatedAt:new Date().toISOString()};
  try{
    await api('save',{entry:next});
    Object.assign(e,next); store(); render();
    toast(next.star?'Treasure にしました':'Treasure を外しました');
  }catch(err){ toast('変更できませんでした：'+err.message); }
}
function shiftMonth(ym,n){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const dayNum=d=>D(d).getDate();
const monWd=d=>'日月火水木金土'[D(d).getDay()]+'曜';

function visible(){
  const q=S.query.trim().toLowerCase();
  return S.entries
    .filter(e=>!S.album||e.album===S.album)
    .filter(e=>!q||(e.title+e.body+(e.album||'')).toLowerCase().includes(q))
    .sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
}
function shots(e){
  if(!e.photos?.length) return '';
  const show=e.photos.slice(0,6),n=Math.min(show.length,6);
  return `<div class="shots n${n}">`+show.map((p,i)=>`
    <div class="shot s${i}" data-open="${e.id}" data-i="${i}"><img data-pid="${p}" alt="">
    ${i===5&&e.photos.length>6?`<span class="plus">+${e.photos.length-5}</span>`:''}</div>`).join('')+`</div>`;
}
function timeline(){
  const list=visible();
  if(!S.entries.length) return `<div class="blank"><b>最初の一日を残す</b>
    <span>下の「書く」から自分で書くか、AI に話した内容を取り込めます。</span></div>`;
  if(!list.length) return `<div class="blank"><b>見つかりません</b><span>条件に合う記録がありませんでした。</span></div>`;
  let h='',ym=null;
  const per={};
  for(const e of list){ const k=e.date.slice(0,7); per[k]=(per[k]||0)+1; }
  for(const e of list){
    const k=e.date.slice(0,7);
    if(k!==ym){ym=k;
      h+=`<div class="month"><b>${k.slice(0,4)}年${+k.slice(5,7)}月</b><i></i><u>${per[k]}</u></div>`;}
    h+=`<article class="entry">
      <div class="dateline"><span class="dd">${dayNum(e.date)}</span><span class="mm">${monWd(e.date)}</span>
        ${e.album?`<span class="chip">${esc(e.album)}</span>`:''}
        ${e.source==='ai'?`<span class="chip ai">AI</span>`:''}</div>
      <div class="pane">
        ${shots(e)}
        <div class="txt"><h3>${esc(e.title)||'無題'}</h3>${e.body?`<p>${esc(e.body)}</p>`:''}</div>
        <div class="tools">${starBtn(e)}<button data-edit="${e.id}">編集</button>
          ${e.photos?.length?`<span>${e.photos.length} 枚</span>`
            :`<button class="want" data-edit="${e.id}">写真を足す</button>`}</div>
      </div></article>`;
  }
  return h;
}
function albums(){
  const m=new Map();
  for(const e of S.entries){
    if(!e.album) continue;
    const a=m.get(e.album)||{n:0,cv:null,last:'',first:'9999'};
    a.n++; a.cv||=e.photos?.[0]||null;
    if(e.date>a.last)a.last=e.date; if(e.date<a.first)a.first=e.date;
    m.set(e.album,a);
  }
  if(!m.size) return `<div class="blank"><b>アルバムはまだありません</b>
    <span>記録に旅行名を入れると、ここにまとまります。</span></div>`;
  return '<div class="albums">'+[...m.entries()].sort((a,b)=>b[1].last.localeCompare(a[1].last))
    .map(([n,a])=>`<button class="alb" data-album="${esc(n)}">
      <div class="cv">${a.cv?`<img data-pid="${a.cv}" alt="">`:''}<em>${a.n} 件</em></div>
      <h4>${esc(n)}</h4><p>${a.first.replace(/-/g,'.')} — ${a.last.replace(/-/g,'.')}</p></button>`).join('')+'</div>';
}
const COLS=[
  {k:'star',  label:'★'},
  {k:'date',  label:'日付'},
  {k:'title', label:'タイトル'},
  {k:'album', label:'旅行名'},
  {k:'photos',label:'写真'},
  {k:'source',label:'出どころ'}
];
function sortRows(list){
  const {k,d}=S.sort;
  return [...list].sort((a,b)=>{
    let x,y;
    if(k==='photos'){x=(a.photos||[]).length;y=(b.photos||[]).length;}
    else if(k==='star'){x=a.star?1:0;y=b.star?1:0;}
    else{x=String(a[k]||'');y=String(b[k]||'');}
    if(x<y)return -1*d; if(x>y)return 1*d;
    return (b.date+b.id).localeCompare(a.date+a.id);
  });
}
function table(){
  const list=sortRows(visible());
  if(!S.entries.length) return `<div class="blank"><b>まだ記録がありません</b>
    <span>下の「書く」から始めてください。</span></div>`;
  if(!list.length) return `<div class="blank"><b>見つかりません</b><span>条件に合う記録がありませんでした。</span></div>`;
  const head=COLS.map(c=>{
    const on=S.sort.k===c.k;
    return `<th data-sort="${c.k}" class="${on?'on':''} ${c.k==='star'?'cst':''}">${c.label}${
      c.k==='star'?'':`<span class="ar">${on?(S.sort.d===1?'▲':'▼'):'▼'}</span>`}</th>`;}).join('');
  const rows=list.map(e=>`<tr data-edit="${e.id}">
    <td class="cst">${starBtn(e)}</td>

    <td class="cS ${e.source==='ai'?'ai':''}">${e.source==='ai'?'AI':'自分'}</td></tr>`).join('');
  return `<div class="tblwrap"><table class="rec">

    <div class="tblfoot"><span>${list.length} 件</span>

function toCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Treasure','日付','タイトル','旅行名','本文','写真枚数','出どころ']]
    .concat(sortRows(visible()).map(e=>[e.star?'★':'',e.date,e.title,e.album,e.body,
      (e.photos||[]).length, e.source==='ai'?'AI':'自分']));
  const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n')],
    {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='memory-os-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

const ymKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function calendar(){
  if(!S.cal){
    const newest=[...S.entries].sort((a,b)=>b.date.localeCompare(a.date))[0];
    S.cal=newest?newest.date.slice(0,7):new Date().toISOString().slice(0,7);
  }
  const [Y,M]=S.cal.split('-').map(Number);
  const first=new Date(Y,M-1,1), lead=first.getDay(), days=new Date(Y,M,0).getDate();
  const today=new Date().toISOString().slice(0,10);
  const by={};
  for(const e of S.entries.filter(e=>!S.album||e.album===S.album)) (by[e.date]||=[]).push(e);

  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="cell void"></div>';
  for(let d=1;d<=days;d++){
    const key=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const es=by[key]||[], pic=es.flatMap(e=>e.photos||[])[0];
    cells+=`<div class="cell ${es.length?'has':''} ${pic?'shot':''} ${key===today?'now':''}"
      ${es.length?`data-day="${key}"`:''}>
      ${pic?`<img data-pid="${pic}" alt="">`:''}
      <b>${d}</b>
      ${es.length&&!pic?`<span class="dot"></span>`:''}
      ${es.length&&pic?`<span class="ttl">${esc(es[0].title||'')}</span>`:''}
    </div>`;
  }
  const n=Object.keys(by).filter(k=>k.startsWith(S.cal)).length;
  const total=Object.keys(by).filter(k=>k.startsWith(S.cal))
    .reduce((a,k)=>a+by[k].length,0);
  return `<div class="calbar">
      <button id="cPrev" aria-label="前の月"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2>${Y}年${M}月</h2>
      <button id="cNext" aria-label="次の月"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="grow"></div>
      <button class="today" id="cNow">今月</button></div>
    <div class="wk">${'日月火水木金土'.split('').map((w,i)=>`<span class="s${i}">${w}</span>`).join('')}</div>
    <div class="cal">${cells}</div>
    <div class="calsum">${total?`この月は ${n} 日 / ${total} 件`:'この月の記録はありません'}</div>`;
}

let flipping=false;
function flip(dir){
  if(flipping) return;
  const total=bookList().length, next=S.page+dir;
  if(next<0||next>=total) return;
  const leaf=$('#leaf');
  if(!leaf){ S.page=next; render(); return; }
  flipping=true;
  leaf.style.transformOrigin = dir>0 ? 'left center' : 'right center';
  leaf.classList.add('turn-f');
  setTimeout(()=>{
    S.page=next; render();
    const l=$('#leaf');
    if(l){ l.style.transformOrigin = dir>0 ? 'right center' : 'left center';
      l.classList.add('turn-b');
      l.addEventListener('animationend',()=>l.classList.remove('turn-b'),{once:true}); }
    flipping=false;
  },300);
}

document.querySelectorAll('.grab').forEach(g=>{
  const sheet=g.closest('.sheet');
  let y0=null,moved=0,t0=0;
  const begin=y=>{y0=y;moved=0;t0=Date.now();sheet.classList.add('dragging');};
  const move=y=>{
    if(y0===null)return;
    moved=Math.max(0,y-y0);
    sheet.style.transform='translateY('+moved+'px)';
  };
  const end=()=>{
    if(y0===null)return;
    sheet.classList.remove('dragging');
    sheet.style.transform='';
    const quick=Date.now()-t0<260&&moved>34;
    if(moved>96||quick) closeAll();
    else if(moved<6) closeAll();     // ほぼ動いていなければタップとみなす
    y0=null;
  };
  g.addEventListener('touchstart',e=>begin(e.touches[0].clientY),{passive:true});
  g.addEventListener('touchmove',e=>{move(e.touches[0].clientY);e.preventDefault();},{passive:false});
  g.addEventListener('touchend',end);
  g.addEventListener('touchcancel',end);
  g.addEventListener('click',ev=>{ if(y0===null&&moved===0) closeAll(); });
});

function parseJson(raw){
  let t=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('['),b=t.lastIndexOf(']'),c=t.indexOf('{'),e=t.lastIndexOf('}');
  if(a>=0&&b>a)t=t.slice(a,b+1); else if(c>=0&&e>c)t=t.slice(c,e+1);
  let v=JSON.parse(t);
  if(!Array.isArray(v))v=v.entries||v.記録||[v];
  return v;
}

  const m=s.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);

          :new Date().toISOString().slice(0,10);};

  const onlyStar=$('#prStar').checked;
  const list=[...visible()].filter(e=>!onlyStar||e.star)
    .sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
  if(!list.length) return toast(onlyStar?'Treasure がありません':'印刷できる記録がありません');
  const btn=$('#printBtn'); btn.disabled=true;
  const ids=[...new Set(list.flatMap(e=>e.photos||[]))];
  toast(ids.length?`写真 ${ids.length} 枚を読み込んでいます`:'組版しています');
  const pics={};
  for(const id of ids){ try{ pics[id]=await photoUrl(id); }catch{} }

  const title=S.album||'Memory OS';
  const span=list.length>1
    ? list[0].date.replace(/-/g,'.')+' — '+list[list.length-1].date.replace(/-/g,'.')
    : list[0].date.replace(/-/g,'.');
  let h=`<div class="bk-cover"><h1>${esc(title)}</h1>
    <p>${span}</p><p>${list.length} 件の記録${onlyStar?'　TREASURES':''}</p></div>`;
  let ym=null;
  for(const e of list){
    const k=e.date.slice(0,7);
    if(k!==ym){ym=k;h+=`<div class="bk-mon">${k.slice(0,4)}年${+k.slice(5,7)}月</div>`;}
    const ph=(e.photos||[]).filter(p=>pics[p]).slice(0,6);
    h+=`<div class="bk-e">
      <div class="bk-h"><b>${D(e.date).getDate()}</b>
        <span>${'日月火水木金土'[D(e.date).getDay()]}曜${e.album&&!S.album?'　'+esc(e.album):''}</span></div>
      <p class="bk-t">${esc(e.title)||'無題'}</p>
      ${e.body?`<p class="bk-b">${esc(e.body)}</p>`:''}
      ${ph.length?`<div class="bk-p p${ph.length}">`+ph.map(p=>`<img src="${pics[p]}" alt="">`).join('')+`</div>`:''}
    </div>`;
  }
  const bk=$('#book'); bk.innerHTML=h; bk.hidden=false;
  closeAll();
  setTimeout(()=>{ window.print(); btn.disabled=false; }, 350);
};
addEventListener('afterprint',()=>{ $('#book').innerHTML=''; $('#book').hidden=true; });

/* ページを指でめくる */
let tX=null,tY=null;
$('#main').addEventListener('touchstart',ev=>{
  if(S.view!=='book')return;
  tX=ev.touches[0].clientX; tY=ev.touches[0].clientY;
},{passive:true});
$('#main').addEventListener('touchend',ev=>{
  if(S.view!=='book'||tX===null)return;
  const dx=ev.changedTouches[0].clientX-tX, dy=ev.changedTouches[0].clientY-tY;
  tX=null;
  if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.6) flip(dx<0?1:-1);
},{passive:true});

function measure(){
  const h=document.querySelector('.top').offsetHeight;
  document.documentElement.style.setProperty('--hdrh', h+'px');
}
measure(); addEventListener('resize', measure); addEventListener('orientationchange', measure);

render();
if(S.url)pull(); else open($('#setupSheet'));
</script>
</body>
</html>
