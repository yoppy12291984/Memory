<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFEC">
<title>Memory OS</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memory OS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#EDEFEC; --panel:#FFFFFF; --ink:#1E2328; --muted:#69727C;
  --rule:#D4D9D2; --ai:#2C5A82; --shu:#B8462F; --shadow:0 1px 2px rgba(30,35,40,.06),0 8px 24px rgba(30,35,40,.06);
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#14181B; --panel:#1C2227; --ink:#E7EAE7; --muted:#8B959B;
  --rule:#2C343A; --ai:#7FAED6; --shu:#D4715A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.top-in{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.mark{width:27px;height:27px;flex:none;border-radius:7px;object-fit:cover;
  box-shadow:0 1px 3px rgba(30,35,40,.18)}
.brand{font-family:var(--mincho);font-size:19px;font-weight:600;letter-spacing:.12em;margin:0}
.spacer{flex:1}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.icon:hover{background:var(--rule);color:var(--ink)}
.tabs{max-width:820px;margin:0 auto;padding:0 16px;display:flex;gap:22px}
.tab{padding:6px 0 10px;font-size:13px;letter-spacing:.1em;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 120px}

.search{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:9px 13px;font-size:14px;margin-bottom:22px}
.search::placeholder{color:var(--muted)}

.era{display:flex;align-items:flex-start;gap:14px;margin:34px 0 14px}
.era-num{font-family:var(--mincho);font-size:40px;line-height:1;font-weight:600}
.era-line{flex:1;height:1px;background:var(--rule);transform:translateY(28px)}
.era-count{font-family:var(--mono);font-size:11px;color:var(--muted);transform:translateY(24px)}

.row{display:flex;gap:14px;align-items:stretch}
.rail{width:26px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.rail-date{writing-mode:vertical-rl;font-family:var(--mincho);font-size:13px;letter-spacing:.16em;
  color:var(--muted);white-space:nowrap}
.rail-line{flex:1;width:1px;background:var(--rule);margin-top:8px}
.card{flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:16px 17px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{font-family:var(--mincho);font-size:18px;font-weight:600;margin:0 0 4px;line-height:1.5}
.album-tag{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--shu);
  border:1px solid currentColor;border-radius:99px;padding:1px 9px;margin-bottom:8px}
.ai-tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ai);
  border:1px solid currentColor;border-radius:99px;padding:0 7px;margin:0 0 8px 6px}
.body-txt{white-space:pre-wrap;margin:6px 0 0}
.card-foot{display:flex;gap:14px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.card-foot button:hover{color:var(--ink);text-decoration:underline}
.needs-photo{color:var(--shu)}

.grid{display:grid;gap:6px;margin-top:12px}
.grid.n1{grid-template-columns:1fr}
.grid.n2{grid-template-columns:1fr 1fr}
.grid.n3,.grid.n4{grid-template-columns:repeat(3,1fr)}
.ph{position:relative;aspect-ratio:1/1;background:var(--rule);border-radius:8px;overflow:hidden}
.grid.n1 .ph{aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s ease}
.ph img.on{opacity:1}
.ph .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;
  font-family:var(--mono);font-size:16px}

.note{text-align:center;padding:56px 20px;color:var(--muted)}
.note b{display:block;font-family:var(--mincho);font-size:19px;color:var(--ink);margin-bottom:8px;font-weight:600}

.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--rule);
  border-radius:9px;padding:9px 12px;font-size:15px;font-family:inherit}
.field textarea{min-height:130px;resize:vertical;line-height:1.8}
.field textarea.code{font-family:var(--mono);font-size:13px;line-height:1.6}
.btn{background:var(--ai);color:#fff;border-radius:10px;padding:10px 20px;font-size:14px;letter-spacing:.05em}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.btn:disabled{opacity:.5;cursor:default}

.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.alb{text-align:left}
.alb .cover{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--rule);box-shadow:var(--shadow)}
.alb .cover img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.alb .cover img.on{opacity:1}
.alb h4{font-family:var(--mincho);font-size:15px;margin:9px 0 1px;font-weight:600}
.alb p{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted)}

.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:40}
.fab button{width:56px;height:56px;border-radius:50%;color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab .write{background:var(--shu);font-size:26px}
.fab .imp{background:var(--ai);width:46px;height:46px;margin-left:5px;font-size:12px;letter-spacing:.04em;
  font-family:var(--mono)}

.veil{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:50;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--panel);
  border-radius:18px 18px 0 0;z-index:60;padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translateY(0)}
@media(min-width:700px){.sheet{max-width:660px;margin:0 auto;border-radius:18px;bottom:24px;left:16px;right:16px}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-head h2{font-family:var(--mincho);font-size:18px;margin:0;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--rule)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:grid;place-items:center}
.add-ph{aspect-ratio:1/1;border:1px dashed var(--rule);border-radius:8px;display:grid;place-items:center;
  color:var(--muted);font-size:22px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.prev{border:1px solid var(--rule);border-radius:11px;padding:12px 13px;margin-bottom:9px;display:flex;gap:11px}
.prev input{margin-top:5px;accent-color:var(--ai);width:17px;height:17px;flex:none}
.prev h4{font-family:var(--mincho);font-size:15px;margin:0 0 2px;font-weight:600}
.prev .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prev .txt{font-size:13px;color:var(--muted);margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.prev.dup{opacity:.55}

.lb{position:fixed;inset:0;background:#0B0D0E;z-index:80;display:none;place-items:center}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:88vh;object-fit:contain}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;color:#fff;font-size:26px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;padding:12px;opacity:.75}
.lb .nav.p{left:4px}.lb .nav.n{right:4px}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
  font-size:13px;padding:9px 16px;border-radius:99px;z-index:90;opacity:0;pointer-events:none;transition:.25s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img class="mark" src="icon-192.png" alt="" aria-hidden="true">
    <h1 class="brand">Memory OS</h1>
    <div class="spacer"></div>
    <button class="icon" id="themeBtn" title="表示テーマを切り替える" aria-label="表示テーマを切り替える">◐</button>
    <button class="icon" id="setupBtn" title="接続設定" aria-label="接続設定">⚙</button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="timeline" aria-selected="true">タイムライン</button>
    <button class="tab" role="tab" data-view="albums" aria-selected="false">アルバム</button>
  </nav>
</header>

<main class="wrap" id="main"></main>

<div class="fab">
  <button class="imp" id="importBtn" aria-label="AIから取り込む">AI</button>
  <button class="write" id="newBtn" aria-label="記録を書く">＋</button>
</div>

<div class="veil" id="veil"></div>

<!-- editor -->
<section class="sheet" id="editor" role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="sheet-head">
    <h2 id="edTitle">記録を書く</h2><div class="spacer"></div>
    <button class="icon" id="edClose" aria-label="閉じる">✕</button>
  </div>
  <label class="field"><span>日付</span><input type="date" id="fDate"></label>
  <label class="field"><span>タイトル</span><input id="fTitle" placeholder="例：六甲山の展望台"></label>
  <label class="field"><span>旅行名（空欄なら日常の記録になります）</span>
    <input id="fAlbum" list="albumList" placeholder="例：神戸旅行 2026夏">
    <datalist id="albumList"></datalist></label>
  <label class="field"><span>本文</span><textarea id="fBody" placeholder="その日のこと、話したこと、味、天気。"></textarea></label>
  <div class="field"><span>写真</span>
    <div class="thumbs" id="thumbs"></div>
    <input type="file" id="fFiles" accept="image/*" multiple hidden></div>
  <div class="actions">
    <button class="btn ghost" id="edDelete" hidden>削除</button>
    <button class="btn" id="edSave">保存する</button>
  </div>
</section>

<!-- AI import -->
<section class="sheet" id="importSheet" role="dialog" aria-modal="true" aria-labelledby="imTitle">
  <div class="sheet-head">
    <h2 id="imTitle">AIから取り込む</h2><div class="spacer"></div>
    <button class="icon" id="imClose" aria-label="閉じる">✕</button>
  </div>
  <p class="hint">専用プロジェクトで話した内容を日記にしてもらい、出てきた JSON をそのまま貼ってください。写真は取り込んだあとに各記録から足せます。</p>
  <div class="actions" style="justify-content:flex-start;margin:0 0 14px">
    <button class="btn ghost" id="copyPrompt">プロジェクト用の指示をコピー</button>
  </div>
  <label class="field"><span>AI の出力</span>
    <textarea id="fJson" class="code" placeholder='[{"date":"2026-08-09","title":"六甲山の展望台","album":"神戸旅行 2026夏","body":"..."}]'></textarea></label>
  <div class="actions">
    <button class="btn ghost" id="imCheck">中身を確認する</button>
  </div>
  <div id="preview"></div>
</section>

<!-- setup -->
<section class="sheet" id="setupSheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
  <div class="sheet-head">
    <h2 id="stTitle">接続設定</h2><div class="spacer"></div>
    <button class="icon" id="stClose" aria-label="閉じる">✕</button>
  </div>
  <label class="field"><span>GAS ウェブアプリの URL</span>
    <input id="fUrl" placeholder="https://script.google.com/macros/s/..../exec"></label>
  <p class="hint">写真は Google Drive の「Memory OS 写真」フォルダに、本文はスプレッドシートに保存されます。読み込んだ写真は端末内にも控えるので、2回目からは早く開きます。</p>
  <div class="actions">
    <button class="btn ghost" id="stPull">再読み込み</button>
    <button class="btn" id="stSave">保存する</button>
  </div>
</section>

<div class="lb" id="lb">
  <button class="x" id="lbX" aria-label="閉じる">✕</button>
  <button class="nav p" id="lbP" aria-label="前の写真">‹</button>
  <img id="lbImg" alt="">
  <button class="nav n" id="lbN" aria-label="次の写真">›</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const LS = {url:'mos.url', entries:'mos.entries', theme:'mos.theme'};
const S = {
  url: localStorage.getItem(LS.url) || '',
  entries: JSON.parse(localStorage.getItem(LS.entries) || '[]'),
  view:'timeline', query:'', album:null, editing:null, draftPhotos:[], staged:[]
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const saveLocal = () => localStorage.setItem(LS.entries, JSON.stringify(S.entries));

/* ---- theme ---- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem(LS.theme, t);
  $('meta[name=theme-color]').content = t === 'dark' ? '#14181B' : '#EDEFEC';
}
setTheme(localStorage.getItem(LS.theme) || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2800); }

/* ---- photo cache ---- */
let dbP;
function db(){ return dbP ||= new Promise((res,rej)=>{ const r=indexedDB.open('memoryos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function cacheGet(id){ const d=await db(); return new Promise(res=>{
  const q=d.transaction('photos').objectStore('photos').get(id);
  q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }
async function cachePut(id,u){ const d=await db(); return new Promise(res=>{
  const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').put(u,id);
  tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }

/* ---- API ---- */
async function api(action, payload={}){
  if(!S.url) throw new Error('GAS の URL が未設定です');
  const r = await fetch(S.url,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action, ...payload})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || '通信に失敗しました');
  return j;
}

/* ---- photos ---- */
function shrink(file,max=1600,q=.82){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q)); };
      img.onerror=()=>rej(new Error('画像を読み込めませんでした')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('画像を読み込めませんでした')); fr.readAsDataURL(file); });
}
const inflight = new Map();
async function photoUrl(id){
  const hit = await cacheGet(id); if(hit) return hit;
  if(inflight.has(id)) return inflight.get(id);
  const p = api('photo',{id}).then(async j=>{
    const u='data:'+j.mimeType+';base64,'+j.data; await cachePut(id,u); inflight.delete(id); return u;
  }).catch(e=>{ inflight.delete(id); throw e; });
  inflight.set(id,p); return p;
}
function hydrate(scope=document){
  scope.querySelectorAll('img[data-pid]:not([data-done])').forEach(async img=>{
    img.dataset.done='1';
    try{ img.src=await photoUrl(img.dataset.pid); img.classList.add('on'); }
    catch{ img.closest('.ph,.cover')?.setAttribute('title','写真を読み込めませんでした'); }
  });
}

/* ---- render ---- */
const fmtDay=d=>{const x=new Date(d+'T00:00');return (x.getMonth()+1)+'月'+x.getDate()+'日';};
const wd=d=>'日月火水木金土'[new Date(d+'T00:00').getDay()];

function visible(){
  const q=S.query.trim().toLowerCase();
  return S.entries
    .filter(e=>!S.album || e.album===S.album)
    .filter(e=>!q || (e.title+e.body+(e.album||'')).toLowerCase().includes(q))
    .sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
}
function photoGrid(e){
  if(!e.photos?.length) return '';
  const show=e.photos.slice(0,6), n=Math.min(show.length,4);
  return `<div class="grid n${n}">`+show.map((p,i)=>`
    <div class="ph" data-open="${e.id}" data-i="${i}"><img data-pid="${p}" alt="">
    ${i===5&&e.photos.length>6?`<span class="more">+${e.photos.length-5}</span>`:''}</div>`).join('')+'</div>';
}
function renderTimeline(){
  const list=visible();
  if(!S.entries.length) return `<div class="note"><b>最初の1件から始めましょう</b>
    ＋で自分で書くか、AI から日記を取り込めます。</div>`;
  if(!list.length) return `<div class="note"><b>見つかりません</b>条件に合う記録がありませんでした。</div>`;
  let html='',year=null;
  for(const e of list){
    const y=e.date.slice(0,4);
    if(y!==year){ year=y; const c=list.filter(x=>x.date.startsWith(y)).length;
      html+=`<div class="era"><div class="era-num">${y}</div><div class="era-line"></div><div class="era-count">${c} 件</div></div>`; }
    html+=`<div class="row">
      <div class="rail"><div class="rail-date">${fmtDay(e.date)}・${wd(e.date)}</div><div class="rail-line"></div></div>
      <article class="card">
        <div>${e.album?`<span class="album-tag">${esc(e.album)}</span>`:''}${e.source==='ai'?`<span class="ai-tag">AI</span>`:''}</div>
        <h3>${esc(e.title)||'無題'}</h3>
        ${e.body?`<p class="body-txt">${esc(e.body)}</p>`:''}
        ${photoGrid(e)}
        <div class="card-foot"><button data-edit="${e.id}">編集</button>
        ${e.photos?.length?`<span>写真 ${e.photos.length} 枚</span>`
          :`<button class="needs-photo" data-edit="${e.id}">写真を足す</button>`}</div>
      </article></div>`;
  }
  return html;
}
function renderAlbums(){
  const map=new Map();
  for(const e of S.entries){
    if(!e.album) continue;
    const a=map.get(e.album)||{n:0,cover:null,last:'',first:'9999'};
    a.n++; a.cover ||= e.photos?.[0]||null;
    if(e.date>a.last) a.last=e.date;
    if(e.date<a.first) a.first=e.date;
    map.set(e.album,a);
  }
  if(!map.size) return `<div class="note"><b>アルバムはまだありません</b>記録に旅行名を入れると、ここにまとまります。</div>`;
  return '<div class="albums">'+[...map.entries()].sort((a,b)=>b[1].last.localeCompare(a[1].last))
    .map(([name,a])=>`<button class="alb" data-album="${esc(name)}">
      <div class="cover">${a.cover?`<img data-pid="${a.cover}" alt="">`:''}</div>
      <h4>${esc(name)}</h4>
      <p>${a.first.replace(/-/g,'.')} — ${a.last.replace(/-/g,'.')}・${a.n}</p></button>`).join('')+'</div>';
}
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===S.view));
  const head = S.album
    ? `<div style="margin-bottom:14px"><button class="btn ghost" id="clearAlbum">← すべての記録へ</button>
       <span style="margin-left:12px;font-family:var(--mincho);font-size:17px">${esc(S.album)}</span></div>`
    : `<input class="search" id="q" placeholder="タイトル・本文・旅行名で探す" value="${esc(S.query)}">`;
  const body=(S.view==='albums'&&!S.album)?renderAlbums():renderTimeline();
  $('#main').innerHTML=(S.view==='albums'&&!S.album?'':head)+body;
  const q=$('#q');
  if(q) q.oninput=()=>{const p=q.selectionStart;S.query=q.value;render();const n=$('#q');n.focus();n.setSelectionRange(p,p);};
  hydrate($('#main'));
  $('#albumList').innerHTML=[...new Set(S.entries.map(e=>e.album).filter(Boolean))]
    .map(a=>`<option value="${esc(a)}">`).join('');
}
$('#main').addEventListener('click',ev=>{
  const ed=ev.target.closest('[data-edit]'); if(ed) return openEditor(S.entries.find(e=>e.id===ed.dataset.edit));
  const al=ev.target.closest('[data-album]');
  if(al){ S.album=al.dataset.album; S.view='timeline'; render(); scrollTo(0,0); return; }
  if(ev.target.id==='clearAlbum'){ S.album=null; S.view='albums'; render(); return; }
  const ph=ev.target.closest('[data-open]');
  if(ph) openLightbox(S.entries.find(e=>e.id===ph.dataset.open),+ph.dataset.i);
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.view=t.dataset.view;S.album=null;render();});

/* ---- sheets ---- */
function sheet(el,on){ el.classList.toggle('on',on); $('#veil').classList.toggle('on',
  document.querySelectorAll('.sheet.on').length>0); }
function closeAll(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));
  $('#veil').classList.remove('on'); S.editing=null; S.draftPhotos=[]; }
$('#veil').onclick=closeAll;

/* ---- editor ---- */
function openEditor(entry){
  S.editing=entry||null;
  S.draftPhotos=entry?[...(entry.photos||[])]:[];
  $('#edTitle').textContent=entry?'記録を編集':'記録を書く';
  $('#fDate').value=entry?.date||new Date().toISOString().slice(0,10);
  $('#fTitle').value=entry?.title||'';
  $('#fAlbum').value=entry?.album||S.album||'';
  $('#fBody').value=entry?.body||'';
  $('#edDelete').hidden=!entry;
  drawThumbs(); sheet($('#editor'),true);
}
function drawThumbs(){
  $('#thumbs').innerHTML=S.draftPhotos.map((p,i)=>`
    <div class="thumb"><img data-pid="${p}" class="on" alt=""><button data-rm="${i}" aria-label="この写真を外す">✕</button></div>`).join('')
    +`<button class="add-ph" id="addPh" aria-label="写真を追加">＋</button>`;
  $('#addPh').onclick=()=>$('#fFiles').click();
  $('#thumbs').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.draftPhotos.splice(+b.dataset.rm,1);drawThumbs();});
  hydrate($('#thumbs'));
}
$('#fFiles').onchange=async ev=>{
  const files=[...ev.target.files]; ev.target.value=''; if(!files.length) return;
  toast(`写真を${files.length}枚 取り込んでいます`);
  for(const f of files){
    try{ const dataUrl=await shrink(f);
      const j=await api('upload',{name:f.name,data:dataUrl.split(',')[1]});
      await cachePut(j.id,dataUrl); S.draftPhotos.push(j.id); drawThumbs();
    }catch(e){ toast('写真を保存できませんでした：'+e.message); }
  }
  toast('写真を保存しました');
};
$('#edSave').onclick=async()=>{
  const e={ id:S.editing?.id||uid(),
    date:$('#fDate').value||new Date().toISOString().slice(0,10),
    title:$('#fTitle').value.trim(), album:$('#fAlbum').value.trim(),
    body:$('#fBody').value, photos:[...S.draftPhotos],
    source:S.editing?.source||'me', updatedAt:new Date().toISOString() };
  if(!e.title&&!e.body&&!e.photos.length) return toast('タイトルか本文、写真のどれかを入れてください');
  $('#edSave').disabled=true;
  try{ await api('save',{entry:e});
    const i=S.entries.findIndex(x=>x.id===e.id);
    i<0?S.entries.push(e):S.entries[i]=e;
    saveLocal(); closeAll(); render(); toast('保存しました');
  }catch(err){ toast('保存できませんでした：'+err.message); }
  finally{ $('#edSave').disabled=false; }
};
$('#edDelete').onclick=async()=>{
  if(!S.editing||!confirm('この記録を削除します。よろしいですか？')) return;
  const id=S.editing.id;
  try{ await api('delete',{id});
    S.entries=S.entries.filter(x=>x.id!==id); saveLocal(); closeAll(); render(); toast('削除しました');
  }catch(err){ toast('削除できませんでした：'+err.message); }
};
$('#edClose').onclick=closeAll;
$('#newBtn').onclick=()=>S.url?openEditor(null):(toast('先に接続設定をしてください'),sheet($('#setupSheet'),true));

/* ---- AI import ---- */
const PROMPT = `あなたは「Memory OS」という記録アプリ用の書き起こし役です。
私がその日の出来事や旅行の話を話し言葉で送るので、日記として整えてください。

書き方
- 私の一人称・語り口を残す。盛らない、事実を足さない
- 1日1件、話題が大きく変わるなら分けてよい
- title は15字以内。body は3〜8文
- 旅行の話なら album に旅行名（例「神戸旅行 2026夏」）、日常なら album は空文字
- 日付が言われていなければ、直近の妥当な日付を推定し、body の最後に「（日付は要確認）」と入れる

出力
説明や前置きは書かず、JSON配列だけを返す。

[
  {"date":"2026-08-09","title":"","album":"","body":""}
]`;

$('#importBtn').onclick=()=>{
  if(!S.url){ toast('先に接続設定をしてください'); return sheet($('#setupSheet'),true); }
  $('#preview').innerHTML=''; S.staged=[]; sheet($('#importSheet'),true);
};
$('#imClose').onclick=closeAll;
$('#copyPrompt').onclick=async()=>{
  try{ await navigator.clipboard.writeText(PROMPT); toast('コピーしました。プロジェクトの指示に貼ってください'); }
  catch{ toast('コピーできませんでした。長押しで選択してください'); }
};

function parseJson(raw){
  let t=raw.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('['), b=t.lastIndexOf(']');
  const c=t.indexOf('{'), e=t.lastIndexOf('}');
  if(a>=0&&b>a) t=t.slice(a,b+1); else if(c>=0&&e>c) t=t.slice(c,e+1);
  let v=JSON.parse(t);
  if(!Array.isArray(v)) v=v.entries||v.記録||[v];
  return v;
}
const normDate=d=>{
  const s=String(d||'').trim();
  const m=s.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return new Date().toISOString().slice(0,10);
};
$('#imCheck').onclick=()=>{
  const raw=$('#fJson').value;
  if(!raw.trim()) return toast('AI の出力を貼ってください');
  let list;
  try{ list=parseJson(raw); }
  catch{ return toast('JSON として読めませんでした。[ から ] までを貼り直してください'); }
  if(!Array.isArray(list)||!list.length) return toast('記録が1件も見つかりませんでした');

  S.staged=list.map(o=>({
    id:uid(), date:normDate(o.date||o.日付),
    title:String(o.title||o.タイトル||'').trim(),
    album:String(o.album||o.旅行名||'').trim(),
    body:String(o.body||o.本文||'').trim(),
    photos:[], source:'ai', updatedAt:new Date().toISOString()
  })).filter(e=>e.title||e.body);

  const dup=e=>S.entries.some(x=>x.date===e.date&&x.title===e.title);
  $('#preview').innerHTML=`<p class="hint" style="margin:16px 0 10px">${S.staged.length} 件 読み取りました。取り込むものを選んでください。</p>`
    + S.staged.map((e,i)=>`<label class="prev ${dup(e)?'dup':''}">
        <input type="checkbox" data-i="${i}" ${dup(e)?'':'checked'}>
        <div><h4>${esc(e.title)||'無題'}</h4>
        <div class="meta">${e.date.replace(/-/g,'.')}${e.album?'・'+esc(e.album):''}${dup(e)?'・取り込み済みかも':''}</div>
        <p class="txt">${esc(e.body)}</p></div></label>`).join('')
    + `<div class="actions"><button class="btn" id="imGo">選んだ分を取り込む</button></div>`;
  $('#imGo').onclick=doImport;
};
async function doImport(){
  const picked=[...$('#preview').querySelectorAll('input:checked')].map(c=>S.staged[+c.dataset.i]);
  if(!picked.length) return toast('取り込むものを選んでください');
  $('#imGo').disabled=true;
  try{
    await api('saveMany',{entries:picked});
    S.entries.push(...picked); saveLocal();
    closeAll(); $('#fJson').value=''; S.view='timeline'; S.album=null; render();
    toast(`${picked.length} 件 取り込みました。写真は各記録から足せます`);
  }catch(err){ toast('取り込めませんでした：'+err.message); }
  finally{ $('#imGo').disabled=false; }
}

/* ---- setup ---- */
$('#setupBtn').onclick=()=>{ $('#fUrl').value=S.url; sheet($('#setupSheet'),true); };
$('#stClose').onclick=closeAll;
$('#stSave').onclick=async()=>{ S.url=$('#fUrl').value.trim(); localStorage.setItem(LS.url,S.url); closeAll(); await pull(); };
$('#stPull').onclick=()=>pull();
async function pull(){
  if(!S.url) return;
  try{ const j=await api('list'); S.entries=j.entries; saveLocal(); render(); toast('最新の状態にしました'); }
  catch(e){ toast('読み込めませんでした：'+e.message); }
}

/* ---- lightbox ---- */
let lbSet=[],lbI=0;
async function showLb(){ const img=$('#lbImg'); img.removeAttribute('src');
  try{ img.src=await photoUrl(lbSet[lbI]); }catch{ toast('写真を読み込めませんでした'); } }
function openLightbox(entry,i){
  if(!entry?.photos?.length) return;
  lbSet=entry.photos; lbI=Math.min(i,lbSet.length-1); $('#lb').classList.add('on'); showLb();
}
$('#lbX').onclick=()=>$('#lb').classList.remove('on');
$('#lbP').onclick=()=>{lbI=(lbI-1+lbSet.length)%lbSet.length;showLb();};
$('#lbN').onclick=()=>{lbI=(lbI+1)%lbSet.length;showLb();};
addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if($('#lb').classList.contains('on')) $('#lb').classList.remove('on'); else closeAll(); }
  if(!$('#lb').classList.contains('on')) return;
  if(ev.key==='ArrowLeft') $('#lbP').click();
  if(ev.key==='ArrowRight') $('#lbN').click();
});

render();
if(S.url) pull(); else sheet($('#setupSheet'),true);
</script>
</body>
</html>
